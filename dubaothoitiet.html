<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dự Báo Thời Tiết - Tấn Minh</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            color: white;
        }

        .header h1 {
            font-size: 3.5em;
            font-weight: 700;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            background: linear-gradient(45deg, #fff, #f0f8ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .search-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        select {
            width: 100%;
            padding: 15px 20px;
            font-size: 1.1em;
            border: none;
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        select:focus {
            outline: none;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        }

        .weather-display {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 25px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .weather-current {
            display: flex;
            align-items: center;
            gap: 30px;
            margin-bottom: 30px;
            padding: 20px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border-radius: 20px;
            color: white;
        }

        .weather-icon {
            width: 150px;
            height: 150px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.2);
            padding: 15px;
            backdrop-filter: blur(10px);
        }

        .weather-info h2 {
            margin: 0;
            font-size: 2.5em;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .weather-info p {
            margin: 8px 0;
            font-size: 1.3em;
            opacity: 0.9;
        }

        .weather-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }

        .weather-details div {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            font-size: 1em;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }

        .weather-details div:hover {
            transform: translateY(-5px);
        }

        .weather-details div strong {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9em;
            opacity: 0.8;
        }

        .forecast-section {
            margin-top: 40px;
        }

        .forecast-section h3 {
            font-size: 2em;
            margin-bottom: 20px;
            color: #333;
            text-align: center;
            font-weight: 600;
        }

        .forecast {
            display: flex;
            overflow-x: auto;
            gap: 20px;
            padding: 20px 0;
            scrollbar-width: thin;
            scrollbar-color: #667eea #f1f1f1;
        }

        .forecast::-webkit-scrollbar {
            height: 8px;
        }

        .forecast::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        .forecast::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
        }

        .forecast-day {
            min-width: 160px;
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
            color: #333;
        }

        .forecast-day:hover {
            transform: translateY(-5px);
        }

        .forecast-day p {
            margin: 10px 0;
            font-size: 1em;
            font-weight: 500;
        }

        .forecast-day p:first-child {
            font-weight: 700;
            font-size: 1.1em;
            color: #333;
        }

        .forecast-icon {
            width: 70px;
            height: 70px;
            margin: 10px auto;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.3);
            padding: 5px;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2.5em;
            }
            
            .weather-current {
                flex-direction: column;
                text-align: center;
            }
            
            .weather-icon {
                width: 120px;
                height: 120px;
            }
            
            .weather-details {
                grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
                gap: 15px;
            }
        }

<body>
    <div class="container">
        <div class="header">
            <h1>🌤️ Dự Báo Thời Tiết Việt Nam</h1>
            <p>Chọn tỉnh thành để xem thông tin thời tiết chi tiết</p>
        </div>
        
        <div class="search-container">
            <select id="province-select">
                <option value="">Chọn tỉnh thành</option>
            </select>
        </div>
        
        <div id="weather-display" style="display: none;">
            <div class="weather-current">
                <img id="current-icon" class="weather-icon" src="" alt="Weather Icon">
                <div class="weather-info">
                    <h2 id="location"></h2>
                    <p id="temperature"></p>
                    <p id="status"></p>
                </div>
            </div>
            
            <div class="weather-details">
                <div><strong>Cao nhất</strong><span id="high"></span>°C</div>
                <div><strong>Thấp nhất</strong><span id="low"></span>°C</div>
                <div><strong>Cảm giác như</strong><span id="feels-like"></span>°C</div>
                <div><strong>Độ ẩm</strong><span id="humidity"></span></div>
                <div><strong>Tầm nhìn</strong><span id="visibility"></span></div>
                <div><strong>UV Index</strong><span id="uv-index"></span></div>
                <div><strong>Gió</strong><span id="wind"></span></div>
                <div><strong>Mặt trời mọc</strong><span id="sunrise"></span></div>
                <div><strong>Mặt trời lặn</strong><span id="sunset"></span></div>
            </div>
            
            <div class="forecast-section">
                <h3>📅 Dự báo 7 ngày</h3>
                <div class="forecast" id="forecast"></div>
            </div>
        </div>
    </div>
    <script>
        const select = document.getElementById('province-select');
        data.forEach(province => {
            const option = document.createElement('option');
            option.value = province.value;
            option.textContent = province.name;
            select.appendChild(option);
        });

        select.addEventListener('change', function() {
            const value = this.value;
            if (value) {
                fetchWeather(value);
            } else {
                document.getElementById('weather-display').style.display = 'none';
            }
        });

        async function fetchWeather(value) {
            try {
                const response = await fetch(`https://api.allorigins.win/raw?url=https://utils3.cnnd.vn/ajax/weatherinfo/${value}.htm`);
                const data = await response.json();
                if (data.Data.success) {
                    displayWeather(data.Data.data.datainfo);
                }
            } catch (error) {
                console.error('Error fetching weather data:', error);
            }
        }

        function displayWeather(info) {
            document.getElementById('location').textContent = info.location;
            document.getElementById('temperature').textContent = `${info.temperature}°C`;
            document.getElementById('status').textContent = info.status;
            document.getElementById('high').textContent = info.high;
            document.getElementById('low').textContent = info.low;
            document.getElementById('feels-like').textContent = info.feels_like;
            document.getElementById('humidity').textContent = info.humidity;
            document.getElementById('visibility').textContent = `${info.visibility.index} ${info.visibility.unit}`;
            document.getElementById('uv-index').textContent = `${info.UV_index.index} (${info.UV_index.status})`;
            document.getElementById('wind').textContent = `${info.wind.index} ${info.wind.unit}`;
            document.getElementById('sunrise').textContent = info.sunrise;
            document.getElementById('sunset').textContent = info.sunset;
            document.getElementById('current-icon').src = info.shadow_icon;

            const forecastDiv = document.getElementById('forecast');
            forecastDiv.innerHTML = '';
            info.forecast.forEach(day => {
                const dayDiv = document.createElement('div');
                dayDiv.className = 'forecast-day';
                dayDiv.innerHTML = `
                    <p>${day.date}</p>
                    <img src="${day.shadow_icon}" alt="Forecast Icon" class="forecast-icon">
                    <p>${day.high}°/${day.low}°</p>
                    <p>${day.status}</p>
                `;
                forecastDiv.appendChild(dayDiv);
            });

            document.getElementById('weather-display').style.display = 'block';
        }
    </script>
</body>
